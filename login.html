<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — TojeToons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f7f8; color: #1e1e22; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 16px; padding: 48px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
  .logo { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 32px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; }
  .btn { width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; display: inline-block; text-align: center; }
  .btn-primary { background: #f2731a; color: #fff; }
  .btn-primary:hover { background: #d95f0e; }
  .btn-google { background: #fff; color: #1e1e22; border: 1px solid #ddd; margin-bottom: 20px; }
  .btn-google:hover { background: #f7f7f8; }
  .divider { text-align: center; color: #999; font-size: 13px; margin: 24px 0; }
  .footer { text-align: center; font-size: 13px; color: #666; margin-top: 24px; }
  .footer a { color: #f2731a; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">TojeToons</div>
    <div class="subtitle">Welcome back</div>
    <button class="btn btn-google">⒯ Continue with Google</button>
    <div class="divider">or</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Your password">
    </div>
    <a href="dashboard.html" class="btn btn-primary">Log In</a>
    <div class="footer"><a href="#">Forgot password?</a> &middot; <a href="signup.html">Create account</a></div>
  </div>
</body>
</html>
