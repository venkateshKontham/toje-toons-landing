<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - TojeToons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f7f8; color: #1e1e22; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 16px; padding: 48px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
  .logo { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 32px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; }
  .btn { width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; display: inline-block; text-align: center; }
  .btn-primary { background: #f2731a; color: #fff; }
  .btn-primary:hover { background: #d95f0e; }
  .footer { text-align: center; font-size: 13px; color: #666; margin-top: 24px; }
  .footer a { color: #f2731a; text-decoration: none; }
  .success { display: none; text-align: center; color: #2e7d32; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">TojeToons</div>
    <div class="subtitle">Reset your password</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="you@example.com" id="email">
    </div>
    <button class="btn btn-primary" id="resetBtn">Send Reset Link</button>
    <div class="success" id="successMsg">Check your inbox for a reset link. It expires in 1 hour.</div>
    <div class="footer"><a href="login.html">Back to log in</a></div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('resetBtn');
      var msg = document.getElementById('successMsg');
      if (btn) {
        btn.addEventListener('click', function() {
          var email = document.getElementById('email').value;
          if (!email) { alert('Please enter your email'); return; }
          msg.style.display = 'block';
          btn.textContent = 'Link Sent';
          btn.disabled = true;
        });
      }
    });
  </script>
</body>
</html>
